[package]
name = "casper-delta-bot"
version = "0.1.0"
edition = "2021"

[dependencies]
casper-delta-contracts = { path = "../casper-delta/casper-delta-contracts" }
casper_trade_contracts = { path = "../casper-trade/casper_trade_contracts" }
styks-contracts = { git = "https://github.com/odradev/styks.git", branch = "feature/casper-shorts-client" }
liquid-staking-contracts = { git = "https://github.com/casper-ecosystem/liquid-staking-contracts", branch = "develop" }
odra = { version = "2.5.0" }
odra-cli = { version = "2.5.0"}
dotenv = "0.15"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rdkafka = { version = "0.36", features = ["ssl", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
odra-test = { version = "2.5.0" }
mockall = "0.14.0"

[[bin]]
name = "bot"
path = "src/bin/cli.rs"
